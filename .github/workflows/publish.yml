name: Publish adapter

# Publishing is driven by the version in packages/adapter-linq/package.json.
# Bump it in a PR; merging that PR to main publishes the package, tags the
# commit, and cuts a GitHub release. See RELEASING.md.
on:
  push:
    branches: [main]
    paths:
      - packages/adapter-linq/package.json
  workflow_dispatch:

concurrency:
  group: publish-adapter
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          name=$(node -p "require('./packages/adapter-linq/package.json').name")
          version=$(node -p "require('./packages/adapter-linq/package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.publish == 'true'
        run: pnpm lint

      - if: steps.version.outputs.publish == 'true'
        run: pnpm format:check

      - if: steps.version.outputs.publish == 'true'
        run: pnpm typecheck

      - if: steps.version.outputs.publish == 'true'
        run: pnpm test

      # `pnpm typecheck` already built dist via the `^build` dependency, but
      # build explicitly so a publish never ships a stale or missing dist.
      - if: steps.version.outputs.publish == 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/adapter-linq
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Tag and release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PKG: ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" \
              --title "$PKG" \
              --generate-notes
          fi
